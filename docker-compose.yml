# Phase 1+2 docker-compose: backend, LightRAG server, and Neo4j.
# (Phase 3 adds no new services -- it's frontend-only additions on top of
# the APIs this file already stands up.)
version: "3.9"

services:
  neo4j:
    image: neo4j:5.24
    container_name: lightrag-explorer-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag-explorer-lightrag
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - LIGHTRAG_GRAPH_STORAGE=Neo4JStorage
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - LLM_BINDING=gemini
      - LLM_MODEL=gemini-3.5-flash-lite
      - LLM_BINDING_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_BINDING=gemini
      - EMBEDDING_BINDING_HOST=DEFAULT_GEMINI_ENDPOINT
      - EMBEDDING_BINDING_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_MODEL=gemini-embedding-001
      - EMBEDDING_DIM=1536
      - EMBEDDING_TOKEN_LIMIT=2048
      - EMBEDDING_SEND_DIM=true
    ports:
      - "9621:9621"
    volumes:
      - lightrag_data:/app/data
    restart: unless-stopped 
 

  backend:
    build: ./backend
    container_name: lightrag-explorer-backend
    depends_on:
      - neo4j
      - lightrag
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override localhost URLs from .env with in-network service names.
      - LIGHTRAG_API_URL=http://lightrag:9621
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

volumes:
  neo4j_data:
  lightrag_data:
